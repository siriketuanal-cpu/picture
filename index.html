<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="壁紙生成">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="画像の見切れを抑え、ぼかし背景で自然に端末画面へ合わせる壁紙作成ツール">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="pwa-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="pwa-icon.png">
<title>壁紙ジェネレーター（見切れ抑制）</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 16px;
    background: #0d0d0d;
    color: #f0f0f0;
    min-height: 100dvh;
    line-height: 1.5;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 16px;
  }

  .info-box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.8rem;
    color: #ccc;
    margin-bottom: 16px;
  }

  .info-box strong {
    color: #fff;
  }

  .file-area {
    margin-bottom: 16px;
  }

  .file-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: #222;
    border: 2px dashed #555;
    border-radius: 12px;
    color: #ddd;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .file-label:active,
  .file-label:hover {
    background: #2a2a2a;
    border-color: #777;
  }

  #fileInput {
    display: none;
  }

  .preview-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 16px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #333;
    /* 縦スクロールは許可。パン開始後は JS で制御 */
    touch-action: pan-y;
  }

  #previewCanvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
    background: #000;
  }

  #previewCanvas.dragging {
    cursor: grabbing;
    touch-action: none;
  }

  .controls {
    max-width: 420px;
    margin: 0 auto;
  }

  .fit-mode {
    display: grid;
    grid-template-columns: 6.5em 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: #bbb;
  }

  .fit-mode select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #222;
    color: #f0f0f0;
    font: inherit;
  }

  input[type="range"]:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .slider-group {
    margin-bottom: 14px;
  }

  .slider-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #bbb;
    margin-bottom: 6px;
  }

  .slider-group .value {
    font-variant-numeric: tabular-nums;
    color: #fff;
    min-width: 3.2em;
    text-align: right;
  }

  input[type="range"] {
    width: 100%;
    height: 28px;
    accent-color: #6af;
    cursor: pointer;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 12px;
    font-size: 0.95rem;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  button:active {
    transform: scale(0.98);
  }

  #resetBtn {
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #444;
  }

  #resetBtn:hover {
    background: #333;
  }

  #downloadBtn {
    background: #1a6bff;
    color: #fff;
  }

  #downloadBtn:hover {
    background: #1558d6;
  }

  #downloadBtn:disabled {
    background: #333;
    color: #777;
    cursor: not-allowed;
  }

  .hint {
    font-size: 0.75rem;
    color: #888;
    text-align: center;
    margin-top: 8px;
  }

  .status {
    font-size: 0.8rem;
    color: #6af;
    text-align: center;
    min-height: 1.2em;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>壁紙ジェネレーター</h1>
  <p class="subtitle">画像をなるべく切らず、自然な背景補完でスマホ待ち受け用に調整</p>

  <div class="info-box" id="infoBox">
    対象解像度: <strong id="resText">検出中…</strong><br>
    画像: <span id="imgInfo">未選択</span>
  </div>

  <div class="file-area">
    <label class="file-label" for="fileInput">
      <span>📁</span>
      <span id="fileLabelText">画像を選択（タップ）</span>
    </label>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-wrap" id="previewWrap">
    <canvas id="previewCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="fit-mode">
      <label for="fitMode">表示方式</label>
      <select id="fitMode">
        <option value="balanced" selected>見切れを抑える（おすすめ）</option>
        <option value="cover">画面を埋める（従来方式）</option>
      </select>
    </div>

    <div class="slider-group">
      <label>
        <span id="xLabel">左右位置</span>
        <span class="value" id="xValue">0.00</span>
      </label>
      <input type="range" id="xSlider" min="-1" max="1" step="0.01" value="0">
    </div>

    <div class="btn-row">
      <button type="button" id="resetBtn">中央に戻す</button>
      <button type="button" id="downloadBtn" disabled>画像を保存</button>
    </div>

    <p class="hint" id="hintText">画像の横幅を残し、上下は画像由来のぼかし背景で自然に補います。</p>
    <p class="status" id="status"></p>
  </div>

<script>
(() => {
  // ===== 解像度（実機の物理ピクセル） =====
  const dpr = window.devicePixelRatio || 1;
  const screenW = Math.round(window.screen.width * dpr);
  const screenH = Math.round(window.screen.height * dpr);

  document.getElementById("resText").textContent =
    `${screenW} × ${screenH} px（この端末）`;

  // ===== DOM =====
  const fileInput = document.getElementById("fileInput");
  const fileLabelText = document.getElementById("fileLabelText");
  const previewCanvas = document.getElementById("previewCanvas");
  const previewCtx = previewCanvas.getContext("2d");
  const xSlider = document.getElementById("xSlider");
  const xValue = document.getElementById("xValue");
  const fitMode = document.getElementById("fitMode");
  const xLabel = document.getElementById("xLabel");
  const hintText = document.getElementById("hintText");
  const resetBtn = document.getElementById("resetBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const imgInfo = document.getElementById("imgInfo");
  const status = document.getElementById("status");
  const previewWrap = document.getElementById("previewWrap");

  // フル解像度用の隠しキャンバス
  const fullCanvas = document.createElement("canvas");
  fullCanvas.width = screenW;
  fullCanvas.height = screenH;
  const fullCtx = fullCanvas.getContext("2d");

  let img = null;
  let imgName = "";
  let edgeProfile = null;

  // プレビュー表示サイズ（CSS幅に合わせて）
  function getPreviewSize() {
    const maxW = Math.min(previewWrap.clientWidth || 360, 420);
    const ratio = screenW / screenH;
    const w = maxW;
    const h = Math.round(w / ratio);
    return { w, h, scale: w / screenW };
  }

  function needsHorizontalCrop() {
    if (!img) return false;
    // cover 時、画像のほうが端末より横長なら左右が切れる。
    return (img.width / img.height) > (screenW / screenH);
  }

  function canPanX() {
    return Boolean(img && fitMode.value === "cover" && needsHorizontalCrop());
  }

  function updateSliderLabels() {
    xValue.textContent = Number(xSlider.value).toFixed(2);
    const panEnabled = canPanX();
    xSlider.disabled = !panEnabled;
    xLabel.textContent = panEnabled ? "左右位置" : "左右位置（固定）";
    hintText.textContent = fitMode.value === "balanced"
      ? "画像の横幅を残し、上下端が単色に近いときは抽出色、それ以外はぼかし背景で自然に補います。"
      : (panEnabled
        ? "プレビューを左右にドラッグで位置調整（上下はそのままスクロール）"
        : "この画像は横方向のトリミングが発生しないため、左右位置は固定です。");
  }

  function toCss(color, alpha = 1) {
    return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
  }

  function readEdgeProfile() {
    // 小さなプローブに縮小して解析するため、元画像が大きくても処理を重くしない。
    const probe = document.createElement("canvas");
    const probeW = 160;
    const probeH = Math.max(24, Math.round(probeW * img.height / img.width));
    probe.width = probeW;
    probe.height = probeH;
    const ctx = probe.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, probeW, probeH);

    try {
      const pixels = ctx.getImageData(0, 0, probeW, probeH).data;
      const stripH = Math.max(6, Math.round(probeH * 0.12));

      function sampleStrip(startY) {
        let r = 0, g = 0, b = 0, count = 0;
        // 一つおきに採取し、平均色と各色成分のばらつきを求める。
        for (let y = startY; y < startY + stripH; y += 2) {
          for (let x = 0; x < probeW; x += 2) {
            const index = (y * probeW + x) * 4;
            r += pixels[index];
            g += pixels[index + 1];
            b += pixels[index + 2];
            count += 1;
          }
        }
        const color = { r: Math.round(r / count), g: Math.round(g / count), b: Math.round(b / count) };
        let spread = 0;
        for (let y = startY; y < startY + stripH; y += 2) {
          for (let x = 0; x < probeW; x += 2) {
            const index = (y * probeW + x) * 4;
            spread += (pixels[index] - color.r) ** 2;
            spread += (pixels[index + 1] - color.g) ** 2;
            spread += (pixels[index + 2] - color.b) ** 2;
          }
        }
        // 標準偏差が約22未満なら、単色・緩やかなグラデーションとして扱う。
        const variance = spread / (count * 3);
        return { color, flat: variance < 500 };
      }

      return {
        top: sampleStrip(0),
        bottom: sampleStrip(probeH - stripH)
      };
    } catch (_) {
      // ピクセルを読み取れない画像は、安全に従来のぼかし背景へ戻す。
      return null;
    }
  }

  function drawBlurredBackground() {
    // 背景は cover + ぼかし。画面外まで少し大きく描き、ぼかしの端の空白を防ぐ。
    const bgScale = Math.max(screenW / img.width, screenH / img.height) * 1.08;
    const bgW = img.width * bgScale;
    const bgH = img.height * bgScale;
    const bgX = (screenW - bgW) / 2;
    const bgY = (screenH - bgH) / 2;

    fullCtx.save();
    fullCtx.filter = `blur(${Math.max(18, Math.round(screenW * 0.025))}px)`;
    fullCtx.globalAlpha = 0.9;
    fullCtx.drawImage(img, bgX, bgY, bgW, bgH);
    fullCtx.restore();

    // 背景の主張を少し抑え、時計やアイコンの視認性も確保する。
    const shade = fullCtx.createLinearGradient(0, 0, 0, screenH);
    shade.addColorStop(0, "rgba(0, 0, 0, 0.26)");
    shade.addColorStop(0.22, "rgba(0, 0, 0, 0.10)");
    shade.addColorStop(0.78, "rgba(0, 0, 0, 0.10)");
    shade.addColorStop(1, "rgba(0, 0, 0, 0.32)");
    fullCtx.fillStyle = shade;
    fullCtx.fillRect(0, 0, screenW, screenH);
  }

  function drawFlatEdgeFill(color, y, height, fromTop) {
    if (height <= 0) return;
    const gradient = fullCtx.createLinearGradient(0, y, 0, y + height);
    if (fromTop) {
      gradient.addColorStop(0, toCss(color, 1));
      gradient.addColorStop(0.7, toCss(color, 0.96));
      gradient.addColorStop(1, toCss(color, 0.82));
    } else {
      gradient.addColorStop(0, toCss(color, 0.82));
      gradient.addColorStop(0.3, toCss(color, 0.96));
      gradient.addColorStop(1, toCss(color, 1));
    }
    fullCtx.fillStyle = gradient;
    fullCtx.fillRect(0, y, screenW, height);
  }

  function drawBalancedWallpaper() {
    // 前景は幅合わせ。左右を一切切らず、元画像はシャープに残す。
    const fgScale = screenW / img.width;
    const fgH = img.height * fgScale;
    const fgY = (screenH - fgH) / 2;
    const topGap = Math.max(0, fgY);
    const bottomGap = Math.max(0, screenH - (fgY + fgH));
    const profile = edgeProfile || readEdgeProfile();

    // 上下端の両方が単色に近い画像は、ぼかさず端の実色で補完する。
    if (profile?.top.flat && profile?.bottom.flat) {
      drawFlatEdgeFill(profile.top.color, 0, topGap, true);
      drawFlatEdgeFill(profile.bottom.color, screenH - bottomGap, bottomGap, false);
    } else {
      // 写真や情報量の多い画像では、元画像の雰囲気を保つぼかし背景を使う。
      drawBlurredBackground();
      if (profile?.top.flat) drawFlatEdgeFill(profile.top.color, 0, topGap, true);
      if (profile?.bottom.flat) drawFlatEdgeFill(profile.bottom.color, screenH - bottomGap, bottomGap, false);
    }

    fullCtx.drawImage(img, 0, fgY, screenW, fgH);
  }

  function draw() {
    if (!img) return;

    const imgRatio = img.width / img.height;
    const screenRatio = screenW / screenH;
    fullCtx.clearRect(0, 0, screenW, screenH);

    // 縦長端末で左右が切れる画像だけ、幅合わせ＋ぼかし背景へ切り替える。
    if (fitMode.value === "balanced" && needsHorizontalCrop()) {
      drawBalancedWallpaper();
    } else {
      let drawW, drawH;
      if (imgRatio > screenRatio) {
        drawH = screenH;
        drawW = imgRatio * drawH;
      } else {
        drawW = screenW;
        drawH = drawW / imgRatio;
      }

      const ox = (screenW - drawW) / 2 + Number(xSlider.value) * (drawW - screenW) / 2;
      const oy = (screenH - drawH) / 2;
      fullCtx.drawImage(img, ox, oy, drawW, drawH);
    }

    // プレビュー
    const { w, h } = getPreviewSize();
    previewCanvas.width = w;
    previewCanvas.height = h;
    previewCtx.clearRect(0, 0, w, h);
    previewCtx.drawImage(fullCanvas, 0, 0, w, h);
  }

  // ===== ファイル読み込み =====
  fileInput.addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    imgName = file.name || "image";
    fileLabelText.textContent = imgName.length > 24
      ? imgName.slice(0, 22) + "…"
      : imgName;

    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      img = image;
      edgeProfile = readEdgeProfile();
      imgInfo.textContent = `${img.width} × ${img.height} px`;
      downloadBtn.disabled = false;
      status.textContent = "";
      xSlider.value = 0;
      updateSliderLabels();
      draw();
    };
    image.onerror = () => {
      status.textContent = "画像の読み込みに失敗しました";
      URL.revokeObjectURL(url);
    };
    image.src = url;
  });

  // ===== スライダー =====
  function onSlider() {
    updateSliderLabels();
    draw();
  }
  xSlider.addEventListener("input", onSlider);

  fitMode.addEventListener("change", () => {
    xSlider.value = 0;
    updateSliderLabels();
    draw();
  });

  resetBtn.addEventListener("click", () => {
    xSlider.value = 0;
    updateSliderLabels();
    draw();
  });

  // ===== 左右ドラッグのみ（上下はページスクロール） =====
  const PAN_THRESHOLD = 10; // px
  let pointerActive = false;
  let panning = false;
  let scrolling = false;
  let startX = 0, startY = 0;
  let startSliderX = 0;

  function applyPanX(clientX) {
    if (!canPanX()) return;
    const { w } = getPreviewSize();
    const dx = (clientX - startX) / (w * 0.5);
    let nx = startSliderX - dx;
    nx = Math.max(-1, Math.min(1, nx));
    xSlider.value = nx.toFixed(2);
    updateSliderLabels();
    draw();
  }

  function pointerDown(clientX, clientY) {
    if (!canPanX()) return;
    pointerActive = true;
    panning = false;
    scrolling = false;
    startX = clientX;
    startY = clientY;
    startSliderX = Number(xSlider.value);
  }

  function pointerMove(clientX, clientY, event) {
    if (!pointerActive || !img) return;

    const dx = clientX - startX;
    const dy = clientY - startY;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    if (!panning && !scrolling) {
      if (absX < PAN_THRESHOLD && absY < PAN_THRESHOLD) return;
      // 縦の方が大きければスクロール（パンしない）
      if (absY >= absX) {
        scrolling = true;
        return;
      }
      // 横の方が大きい → 左右パン開始
      panning = true;
      previewCanvas.classList.add("dragging");
    }

    if (scrolling) return;

    if (panning) {
      if (event) event.preventDefault();
      applyPanX(clientX);
    }
  }

  function pointerUp() {
    pointerActive = false;
    panning = false;
    scrolling = false;
    previewCanvas.classList.remove("dragging");
  }

  // マウス
  previewCanvas.addEventListener("mousedown", (e) => {
    if (!canPanX()) return;
    e.preventDefault();
    pointerDown(e.clientX, e.clientY);
    panning = true;
    previewCanvas.classList.add("dragging");
  });
  window.addEventListener("mousemove", (e) => {
    if (pointerActive && panning) applyPanX(e.clientX);
  });
  window.addEventListener("mouseup", pointerUp);

  // タッチ：上下はそのままスクロール、左右だけパン
  previewCanvas.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener("touchmove", (e) => {
    if (!pointerActive || e.touches.length !== 1) return;
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY, e);
  }, { passive: false });

  window.addEventListener("touchend", pointerUp);
  window.addEventListener("touchcancel", pointerUp);

  // ===== 保存 =====
  downloadBtn.addEventListener("click", () => {
    if (!img) return;
    status.textContent = "保存中…";
    // 少し遅らせてUIを更新
    requestAnimationFrame(() => {
      try {
        const link = document.createElement("a");
        link.href = fullCanvas.toDataURL("image/png");
        const base = imgName.replace(/\.[^.]+$/, "") || "wallpaper";
        link.download = `${base}_wallpaper_${screenW}x${screenH}.png`;
        link.click();
        status.textContent = "保存しました（フル解像度PNG）";
        setTimeout(() => { status.textContent = ""; }, 2500);
      } catch (err) {
        status.textContent = "保存に失敗しました（メモリ不足の可能性）";
      }
    });
  });

  // リサイズ時にプレビュー再描画
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (img) draw();
    }, 150);
  });

  updateSliderLabels();

  // ===== Service Worker（PWA）・更新検知 =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const reg = await navigator.serviceWorker.register("./sw.js");

        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", () => {
            // 新しい SW がインストールされ、すでに古い SW が動いている場合
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              status.textContent = "新しい版があります。再読み込みします…";
              setTimeout(() => location.reload(), 500);
            }
          });
        });

        // 開いたままのとき用に定期チェック
        setInterval(() => reg.update().catch(() => {}), 60 * 1000);
      } catch (_) {}
    });

    // 新しい SW が制御を奪ったときにリロード
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
  }
})();
</script>
</body>
</html>
